<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 210" width="1280" height="210">
  <defs>
    <linearGradient id="connectBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1219" />
      <stop offset="50%" stop-color="#0d171e" />
      <stop offset="100%" stop-color="#091017" />
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#30363d" />
      <stop offset="50%" stop-color="#56d364" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#30363d" />
    </linearGradient>

    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <!-- Frame -->
  <rect x="2" y="2" width="1276" height="206" rx="16" fill="url(#connectBg)" stroke="url(#borderGrad)" stroke-width="1.5" />

  <!-- Content -->
  <g transform="translate(640, 48)" text-anchor="middle">
    <text y="0" fill="#8b949e" class="mono" font-size="12" font-weight="600" letter-spacing="3">// HARDWARE TRANSMISSION OPEN</text>
    <text y="30" fill="#e6edf3" class="sans" font-size="24" font-weight="800" letter-spacing="0.5">LET'S CONNECT &amp; COLLABORATE 🤝</text>
    <text y="58" fill="#8b949e" class="sans" font-size="14">
      Always keen to discuss embedded firmware architecture, real-time operating systems, and edge telemetry.
    </text>
  </g>

  <!-- Terminal Command Prompt -->
  <g transform="translate(640, 152)" text-anchor="middle">
    <rect x="-280" y="-16" width="560" height="34" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1" />
    <text x="0" y="5" fill="#c9d1d9" class="mono" font-size="12">
      <tspan fill="#56d364">abhishek@xnomous-node:~$</tspan> ping -c 1 collaboration.network [200 OK]
    </text>
  </g>
</svg>
