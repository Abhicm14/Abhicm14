  <!-- Card 6: Springer Nature Publication (Bottom-Right) -->
  <a href="https://doi.org/10.1007/978-981-97-8861-3_15" target="_blank" class="card-hover">
    <g transform="translate(655, 485)">
      <rect width="585" height="175" rx="12" fill="url(#cardBg)" stroke="#30363d" stroke-width="1.2" class="card-frame" />
      <g transform="translate(22, 28)">
        <text x="0" y="0" fill="#58d7ff" class="mono card-tag">SPRINGER NATURE RESEARCH</text>
        <text x="540" y="0" fill="#8b949e" class="mono card-tag" text-anchor="end">📖 ICMISC 2024</text>
        <text x="0" y="26" class="sans card-title">ASR Voice Elevator Control System</text>
        <text x="0" y="50" class="sans card-desc">Contactless speech-driven elevator floor selector with acoustic feature</text>
        <text x="0" y="70" class="sans card-desc">extraction and real-time command processing. Formally published paper.</text>
        
        <!-- Badges -->
        <g transform="translate(0, 92)">
          <rect x="0" y="0" width="95" height="24" rx="5" fill="url(#pillBg)" stroke="#30363d" stroke-width="1" />
          <text x="47.5" y="16" class="pill-text" text-anchor="middle">Arduino Nano</text>

          <rect x="103" y="0" width="130" height="24" rx="5" fill="url(#pillBg)" stroke="#30363d" stroke-width="1" />
