        <text x="0" y="50" class="sans card-desc">Built with AI assistance as a personal learning habit to help learners.</text>
        <text x="0" y="70" class="sans card-desc">Contributions welcome! Open for community pull requests to grow this repo.</text>
        
        <!-- Badges -->
