          <rect x="93" y="0" width="80" height="24" rx="5" fill="url(#pillBg)" stroke="#30363d" stroke-width="1" />
          <text x="133" y="16" class="pill-text" text-anchor="middle">Docsify</text>

          <rect x="181" y="0" width="80" height="24" rx="5" fill="url(#pillBg)" stroke="#30363d" stroke-width="1" />
          <text x="221" y="16" class="pill-text" text-anchor="middle">Markdown</text>

          <rect x="269" y="0" width="130" height="24" rx="5" fill="url(#pillBg)" stroke="#315b4a" stroke-width="1" />
          <text x="334" y="16" class="pill-text" text-anchor="middle" fill="#56d364">🤝 Help Grow Repo</text>
        </g>
      </g>
    </g>
  </a>

  <!-- ================= GRID ROW 3 ================= -->
  <!-- Card 5: Industrial Plant Manager (Bottom-Left) -->
  <a href="https://github.com/Abhicm14/C_Programming" target="_blank" class="card-hover">
    <g transform="translate(40, 485)">
      <rect width="585" height="175" rx="12" fill="url(#cardBg)" stroke="#30363d" stroke-width="1.2" class="card-frame" />
      <g transform="translate(22, 28)">
        <text x="0" y="0" fill="#56d364" class="mono card-tag">DYNAMIC DATA STRUCTURES</text>
        <text x="540" y="0" fill="#8b949e" class="mono card-tag" text-anchor="end">⚙️ C MEMORY MODEL</text>
        <text x="0" y="26" class="sans card-title">Industrial Plant Management Engine</text>
        <text x="0" y="50" class="sans card-desc">Modular machine node tracking in Embedded C using defensive dynamic</text>
        <text x="0" y="70" class="sans card-desc">linked lists, heap safety, and pointer manipulation architectures.</text>
        
        <!-- Badges -->
