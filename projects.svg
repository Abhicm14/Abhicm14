  <!-- Card 4: Roadmap (Mid-Right) - AI assistance & contribution welcome -->
  <a href="https://github.com/Abhicm14/embedded-engineering-roadmap" target="_blank" class="card-hover">
    <g transform="translate(655, 290)">
