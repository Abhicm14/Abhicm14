        <text x="540" y="0" fill="#8b949e" class="mono card-tag" text-anchor="end">⚙️ REPO: ESP32</text>
        <text x="0" y="26" class="sans card-title">ESP32 — FreeRTOS Firmware Architecture</text>
        <text x="0" y="50" class="sans card-desc">Deterministic real-time multitasking: thread-safe Queues, Binary/Counting</text>
        <text x="0" y="70" class="sans card-desc">Semaphores, Mutexes, Event Groups, and Software Timers on ESP-IDF.</text>
        
        <!-- Badges -->
        <g transform="translate(0, 92)">
