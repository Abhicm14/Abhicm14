          <rect x="103" y="0" width="95" height="24" rx="5" fill="url(#pillBg)" stroke="#30363d" stroke-width="1" />
          <text x="150.5" y="16" class="pill-text" text-anchor="middle">Linked Lists</text>

          <rect x="206" y="0" width="95" height="24" rx="5" fill="url(#pillBg)" stroke="#30363d" stroke-width="1" />
          <text x="253.5" y="16" class="pill-text" text-anchor="middle">Heap Safety</text>

          <rect x="309" y="0" width="70" height="24" rx="5" fill="url(#pillBg)" stroke="#30363d" stroke-width="1" />
          <text x="344" y="16" class="pill-text" text-anchor="middle">Pointers</text>
        </g>
