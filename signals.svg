<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 430" width="1280" height="430">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="sigBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1219" />
      <stop offset="50%" stop-color="#0d171e" />
      <stop offset="100%" stop-color="#091017" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#30363d" />
      <stop offset="50%" stop-color="#56d364" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#30363d" />
    </linearGradient>

    <linearGradient id="nodeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111c16" />
      <stop offset="100%" stop-color="#0c1410" />
    </linearGradient>

    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#11161d" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>

    <filter id="packetGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
      
      .node-glyph { font-family: ui-monospace, monospace; font-size: 22px; fill: #56d364; }
      .node-title { font-weight: 700; font-size: 14px; fill: #e6edf3; }
      .node-desc { font-weight: 400; font-size: 11px; fill: #8fa79d; }
      
      .log-line { font-family: ui-monospace, monospace; font-size: 11.5px; }
      .log-ok { fill: #56d364; font-weight: 700; }
      .log-arrow { fill: #58d7ff; font-weight: 700; }
      .log-wait { fill: #e3b341; font-weight: 700; }
      .log-label { fill: #e6edf3; font-weight: 600; }
      .log-desc { fill: #8b949e; }
    </style>
  </defs>

  <!-- Frame Base -->
  <rect x="2" y="2" width="1276" height="426" rx="16" fill="url(#sigBg)" stroke="url(#borderGrad)" stroke-width="1.5" />

  <!-- Section Header -->
  <g transform="translate(640, 36)" text-anchor="middle">
    <text y="0" fill="#8b949e" class="mono" font-size="12" font-weight="600" letter-spacing="3">// HARDWARE ARCHITECTURE &amp; DATA TRANSMISSION</text>
    <text y="26" fill="#e6edf3" class="sans" font-size="22" font-weight="800" letter-spacing="0.5">SIGNAL PATH &amp; LIVING ENGINEERING SIGNALS 📡</text>
  </g>

  <!-- ================= TOP: SIGNAL PATH PIPELINE (TX ➔ RX) ================= -->
  <g transform="translate(45, 80)">
    <!-- Sub-header -->
    <text x="0" y="0" fill="#56d364" class="mono" font-size="11" font-weight="600" letter-spacing="1.5">SIGNAL PATH // HOW I BUILD [TX ➔ RX PIPELINE]</text>

    <!-- Pipeline Grid -->
    <g transform="translate(0, 14)">
      
      <!-- Continuous Signal Pipeline Trace connecting all nodes -->
      <path id="pipelineTrace" d="M 120 44 L 375 44 L 635 44 L 895 44 L 1150 44" 
            fill="none" stroke="#315b4a" stroke-width="1.5" stroke-dasharray="6,4" />

      <!-- Glowing Animated Signal Packets Traveling from Node 1 (Sense) to Node 4 (Observe/RX) -->
      <g filter="url(#packetGlow)">
        <circle r="4.5" fill="#78ffc4">
          <animateMotion path="M 120 44 L 1150 44" dur="3.2s" repeatCount="indefinite" />
        </circle>
      </g>
      <g filter="url(#packetGlow)">
        <circle r="3.5" fill="#58d7ff" opacity="0.8">
          <animateMotion path="M 120 44 L 1150 44" begin="1.6s" dur="3.2s" repeatCount="indefinite" />
        </circle>
      </g>

      <!-- NODE 1: SENSE (Physical Event / TX Origin) -->
      <g transform="translate(0, 0)">
        <rect width="255" height="88" rx="8" fill="url(#nodeBg)" stroke="#315b4a" stroke-width="1.2" />
        <g transform="translate(18, 26)">
          <text x="0" y="0" class="node-glyph">⌁</text>
          <text x="32" y="-4" class="sans node-title">1. Sense</text>
          <text x="32" y="14" fill="#56d364" class="mono" font-size="9.5" font-weight="600">TX INPUT</text>
          <text x="0" y="38" class="sans node-desc">GPIO · sensors · physical events</text>
        </g>
      </g>

      <!-- Arrow 1 -->
      <g transform="translate(262, 38)" stroke="#56d364" stroke-width="1.5" fill="none">
        <line x1="0" y1="6" x2="26" y2="6" stroke-dasharray="3,3" />
        <polyline points="20,1 26,6 20,11" />
      </g>

      <!-- NODE 2: CONTROL (MCU Firmware Logic) -->
      <g transform="translate(295, 0)">
        <rect width="255" height="88" rx="8" fill="url(#nodeBg)" stroke="#315b4a" stroke-width="1.2" />
        <g transform="translate(18, 26)">
          <text x="0" y="0" class="node-glyph">{ }</text>
          <text x="36" y="-4" class="sans node-title">2. Control</text>
          <text x="36" y="14" fill="#58d7ff" class="mono" font-size="9.5" font-weight="600">STM32 / ESP32</text>
          <text x="0" y="38" class="sans node-desc">interrupts · drivers · FreeRTOS</text>
        </g>
      </g>

      <!-- Arrow 2 -->
      <g transform="translate(557, 38)" stroke="#58d7ff" stroke-width="1.5" fill="none">
        <line x1="0" y1="6" x2="26" y2="6" stroke-dasharray="3,3" />
        <polyline points="20,1 26,6 20,11" />
      </g>

      <!-- NODE 3: CONNECT (Physical Bus / TX Transmission) -->
      <g transform="translate(590, 0)">
        <rect width="255" height="88" rx="8" fill="url(#nodeBg)" stroke="#315b4a" stroke-width="1.2" />
        <g transform="translate(18, 26)">
          <text x="0" y="0" class="node-glyph">↯</text>
          <text x="28" y="-4" class="sans node-title">3. Connect (TX)</text>
          <text x="28" y="14" fill="#56d364" class="mono" font-size="9.5" font-weight="600">SERIAL BUS</text>
          <text x="0" y="38" class="sans node-desc">UART · RS485 · ESP-NOW · SPI</text>
        </g>
      </g>

      <!-- Arrow 3 -->
      <g transform="translate(852, 38)" stroke="#56d364" stroke-width="1.5" fill="none">
        <line x1="0" y1="6" x2="26" y2="6" stroke-dasharray="3,3" />
        <polyline points="20,1 26,6 20,11" />
      </g>

      <!-- NODE 4: OBSERVE (Edge Gateway / RX Reception) -->
      <g transform="translate(885, 0)">
        <rect width="255" height="88" rx="8" fill="url(#nodeBg)" stroke="#315b4a" stroke-width="1.2" />
        <g transform="translate(18, 26)">
          <text x="0" y="0" class="node-glyph">▥</text>
          <text x="28" y="-4" class="sans node-title">4. Observe (RX)</text>
          <text x="28" y="14" fill="#58d7ff" class="mono" font-size="9.5" font-weight="600">EDGE GATEWAY</text>
          <text x="0" y="38" class="sans node-desc">gateway · MQTT · data telemetry</text>
        </g>
      </g>
    </g>
  </g>

  <!-- ================= BOTTOM: DYNAMIC GRID (BUILD LOG + METRICS) ================= -->
  <g transform="translate(45, 205)">
    <!-- LEFT CARD: BUILD LOG -->
    <g transform="translate(0, 0)">
      <rect width="575" height="195" rx="10" fill="url(#cardBg)" stroke="#30363d" stroke-width="1.2" />
      <g transform="translate(20, 24)">
        <text x="0" y="0" fill="#56d364" class="mono" font-size="11.5" font-weight="700">FIRMWARE BUILD LOG &amp; LIVE TRACKING</text>
        <text x="535" y="0" fill="#8b949e" class="mono" font-size="10" text-anchor="end">SYS: ACTIVE</text>
        <line x1="0" y1="12" x2="535" y2="12" stroke="#21262d" stroke-width="1" />
        
        <g transform="translate(0, 34)">
          <text x="0" y="0" class="log-line log-ok">[✓]</text>
          <text x="22" y="0" class="log-line log-label">2026-10 :</text>
          <text x="88" y="0" class="log-line log-desc">C &amp; C++ systems workspaces actively maintained</text>

          <text x="0" y="24" class="log-line log-arrow">[→]</text>
          <text x="22" y="24" class="log-line log-label">ROLE    :</text>
          <text x="88" y="24" class="log-line log-desc">Embedded Firmware Engineer @ Xnomous Systems</text>

          <text x="0" y="48" class="log-line log-arrow">[→]</text>
          <text x="22" y="48" class="log-line log-label">FOCUS   :</text>
          <text x="88" y="48" class="log-line log-desc">FreeRTOS deterministic tasks &amp; ESP32 dual-core</text>

          <text x="0" y="72" class="log-line log-wait">[•]</text>
          <text x="22" y="72" class="log-line log-label">NEXT    :</text>
          <text x="88" y="72" class="log-line log-desc">Industrial ANDON RS485 edge monitoring gateway</text>

          <text x="0" y="96" class="log-line log-ok">[✓]</text>
          <text x="22" y="96" class="log-line log-label">PAPERS  :</text>
          <text x="88" y="96" class="log-line log-desc">ASR elevator speech recognition in Springer Nature</text>
        </g>
      </g>
    </g>

    <!-- RIGHT CARD: ACTIVITY METRICS -->
    <g transform="translate(615, 0)">
      <rect width="575" height="195" rx="10" fill="url(#cardBg)" stroke="#30363d" stroke-width="1.2" />
      <g transform="translate(20, 24)">
        <text x="0" y="0" fill="#58d7ff" class="mono" font-size="11.5" font-weight="700">ACTIVITY METRICS &amp; REPOSITORY TELEMETRY</text>
        <text x="535" y="0" fill="#8b949e" class="mono" font-size="10" text-anchor="end">GENUINE DATA</text>
        <line x1="0" y1="12" x2="535" y2="12" stroke="#21262d" stroke-width="1" />

        <!-- Stat Blocks -->
        <g transform="translate(0, 26)">
          <g transform="translate(0, 0)">
            <rect width="165" height="46" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1" />
            <text x="82.5" y="22" fill="#56d364" class="sans" font-size="17" font-weight="800" text-anchor="middle">64+</text>
            <text x="82.5" y="37" fill="#8b949e" class="mono" font-size="9" text-anchor="middle">CONTRIBUTIONS</text>
          </g>
          <g transform="translate(185, 0)">
            <rect width="165" height="46" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1" />
            <text x="82.5" y="22" fill="#58d7ff" class="sans" font-size="17" font-weight="800" text-anchor="middle">8</text>
            <text x="82.5" y="37" fill="#8b949e" class="mono" font-size="9" text-anchor="middle">ACTIVE REPOS</text>
          </g>
          <g transform="translate(370, 0)">
            <rect width="165" height="46" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1" />
            <text x="82.5" y="22" fill="#e6edf3" class="sans" font-size="17" font-weight="800" text-anchor="middle">ARM / MCU</text>
            <text x="82.5" y="37" fill="#8b949e" class="mono" font-size="9" text-anchor="middle">HARDWARE CORE</text>
          </g>
        </g>

        <!-- Sprint Signal Cells -->
        <g transform="translate(0, 92)">
          <text x="0" y="0" fill="#8b949e" class="mono" font-size="9.5" letter-spacing="1">WEEKLY SPRINT SIGNAL MAP:</text>
          <g transform="translate(0, 8)">
            <rect x="0" y="0" width="14" height="14" rx="2" fill="#183329" />
            <rect x="18" y="0" width="14" height="14" rx="2" fill="#246d4d" />
            <rect x="36" y="0" width="14" height="14" rx="2" fill="#183329" />
            <rect x="54" y="0" width="14" height="14" rx="2" fill="#2d9a65" />
            <rect x="72" y="0" width="14" height="14" rx="2" fill="#183329" />
            <rect x="90" y="0" width="14" height="14" rx="2" fill="#246d4d" />
            <rect x="108" y="0" width="14" height="14" rx="2" fill="#56d364" />
            <rect x="126" y="0" width="14" height="14" rx="2" fill="#183329" />
            <rect x="144" y="0" width="14" height="14" rx="2" fill="#246d4d" />
            <rect x="162" y="0" width="14" height="14" rx="2" fill="#183329" />
            <rect x="180" y="0" width="14" height="14" rx="2" fill="#2d9a65" />
            <rect x="198" y="0" width="14" height="14" rx="2" fill="#56d364" />
            <rect x="216" y="0" width="14" height="14" rx="2" fill="#183329" />
            <rect x="234" y="0" width="14" height="14" rx="2" fill="#246d4d" />
            <rect x="252" y="0" width="14" height="14" rx="2" fill="#183329" />
            <rect x="270" y="0" width="14" height="14" rx="2" fill="#56d364" />
            <rect x="288" y="0" width="14" height="14" rx="2" fill="#2d9a65" />
            <rect x="306" y="0" width="14" height="14" rx="2" fill="#183329" />
            <rect x="324" y="0" width="14" height="14" rx="2" fill="#246d4d" />
            <rect x="342" y="0" width="14" height="14" rx="2" fill="#56d364" />
            <rect x="360" y="0" width="14" height="14" rx="2" fill="#2d9a65" />
            <rect x="378" y="0" width="14" height="14" rx="2" fill="#183329" />
            <rect x="396" y="0" width="14" height="14" rx="2" fill="#56d364" />
            <rect x="414" y="0" width="14" height="14" rx="2" fill="#246d4d" />
            <rect x="432" y="0" width="14" height="14" rx="2" fill="#183329" />
            <rect x="450" y="0" width="14" height="14" rx="2" fill="#2d9a65" />
            <rect x="468" y="0" width="14" height="14" rx="2" fill="#56d364" />
            <rect x="486" y="0" width="14" height="14" rx="2" fill="#246d4d" />
            <rect x="504" y="0" width="14" height="14" rx="2" fill="#56d364" />
            <rect x="522" y="0" width="14" height="14" rx="2" fill="#2d9a65" />
          </g>
          <text x="0" y="34" fill="#8b949e" class="sans" font-size="11">
            <em>Hardware determinism &amp; code quality over raw volume. Commits map to live builds.</em>
          </text>
        </g>
      </g>
    </g>
  </g>
</svg>
