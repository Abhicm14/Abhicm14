<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 500" width="1280" height="500">
  <defs>
    <!-- Background Gradient (Dark Clean PCB Ground Plane) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1219" />
      <stop offset="50%" stop-color="#0d171e" />
      <stop offset="100%" stop-color="#091017" />
    </linearGradient>

    <!-- Crisp Light Text Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e6edf3" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#c9d1d9" />
    </linearGradient>

    <!-- Light Sweep Specular Flare -->
    <linearGradient id="flareGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="40%" stop-color="#58d7ff" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.85" />
      <stop offset="60%" stop-color="#56d364" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#30363d" />
      <stop offset="50%" stop-color="#56d364" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#30363d" />
    </linearGradient>

    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#161b22" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0.95" />
    </linearGradient>

    <!-- Glow Filter for Data Packets -->
    <filter id="packetGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Text Mask for Shimmer Animation -->
    <mask id="nameMask">
      <text x="640" y="235" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="62" font-weight="900" letter-spacing="3" text-anchor="middle">ABHISHEK C M</text>
    </mask>

    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
      
      .crisp-name {
        filter: drop-shadow(0 0 1px rgba(88, 215, 255, 0.4)) drop-shadow(0 0 10px rgba(86, 211, 100, 0.15));
      }

      @keyframes floatPulse {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-3px); }
      }
      .name-group {
        animation: floatPulse 4s ease-in-out infinite;
      }

      /* Pulsing Status LED */
      @keyframes pulseLed {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.35; transform: scale(0.85); }
      }
      .led-pulse {
        transform-origin: 70px 50px;
        animation: pulseLed 1.8s infinite ease-in-out;
      }

      /* Digital Wave March */
      @keyframes waveMarch {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: 240; }
      }
      .animated-wave {
        stroke-dasharray: 10, 6;
        animation: waveMarch 7s linear infinite;
      }
    </style>
  </defs>

  <!-- Background Base Frame -->
  <rect x="2" y="2" width="1276" height="496" rx="16" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.5" />

  <!-- ================= TOP: UNIFIED STATUS BAR & 3-PROTOCOL BUS ACTIVITY HUB ================= -->
  <g transform="translate(0, 0)">
    <!-- Left Status Section: LED & Kernel State -->
    <g transform="translate(0, 0)">
      <circle cx="65" cy="46" r="5" fill="#56d364" class="led-pulse" />
      <circle cx="65" cy="46" r="10" fill="#56d364" opacity="0.2" />
      <text x="85" y="50" fill="#56d364" class="mono" font-size="11.5" font-weight="700" letter-spacing="1.5">SYSTEM STATUS: ONLINE</text>
      <text x="270" y="50" fill="#30363d" class="mono" font-size="12">//</text>
      <text x="286" y="50" fill="#8b949e" class="mono" font-size="11" font-weight="600">RTOS ACTIVE</text>
    </g>

    <!-- Center Section: 3-PROTOCOL HARDWARE TRANSCEIVER MONITOR -->
    <g transform="translate(420, 30)">
      <!-- Transceiver Frame -->
      <rect width="470" height="32" rx="6" fill="#111c18" stroke="#315b4a" stroke-width="1" />
      
      <!-- PROTOCOL 1: UART Indicator & Motion -->
      <g transform="translate(12, 20)">
        <text x="0" y="0" fill="#56d364" class="mono" font-size="10.5" font-weight="700">UART [115.2k]</text>
        <line x1="86" y1="-4" x2="120" y2="-4" stroke="#21262d" stroke-width="1.5" stroke-dasharray="2,2" />
        <circle r="2.5" fill="#56d364" filter="url(#packetGlow)">
          <animate attributeName="cx" values="86; 120" dur="1.4s" repeatCount="indefinite" />
          <animate attributeName="cy" values="-4; -4" dur="1.4s" repeatCount="indefinite" />
        </circle>
      </g>

      <line x1="145" y1="6" x2="145" y2="26" stroke="#253545" stroke-width="1" />

      <!-- PROTOCOL 2: SPI Indicator & Motion -->
      <g transform="translate(158, 20)">
        <text x="0" y="0" fill="#58d7ff" class="mono" font-size="10.5" font-weight="700">SPI [10 MHz]</text>
        <line x1="80" y1="-4" x2="114" y2="-4" stroke="#21262d" stroke-width="1.5" stroke-dasharray="2,2" />
        <circle r="2.5" fill="#58d7ff" filter="url(#packetGlow)">
          <animate attributeName="cx" values="80; 114" dur="1.0s" repeatCount="indefinite" />
          <animate attributeName="cy" values="-4; -4" dur="1.0s" repeatCount="indefinite" />
        </circle>
      </g>

      <line x1="285" y1="6" x2="285" y2="26" stroke="#253545" stroke-width="1" />

      <!-- PROTOCOL 3: I2C Indicator & Motion -->
      <g transform="translate(298, 20)">
        <text x="0" y="0" fill="#e3b341" class="mono" font-size="10.5" font-weight="700">I2C [400 kHz]</text>
        <line x1="80" y1="-4" x2="114" y2="-4" stroke="#21262d" stroke-width="1.5" stroke-dasharray="2,2" />
        <circle r="2.5" fill="#e3b341" filter="url(#packetGlow)">
          <animate attributeName="cx" values="80; 114" dur="1.8s" repeatCount="indefinite" />
          <animate attributeName="cy" values="-4; -4" dur="1.8s" repeatCount="indefinite" />
        </circle>
      </g>

      <!-- All Synced Dot -->
      <circle cx="452" cy="16" r="3.5" fill="#56d364" />
    </g>

    <!-- Right Section: Organization & Node Role -->
    <text x="1235" y="50" fill="#e6edf3" class="mono" font-size="11.5" font-weight="600" text-anchor="end">
      XNOMOUS SYSTEMS PVT LTD <tspan fill="#56d364">•</tspan> <tspan fill="#8b949e">FIRMWARE</tspan>
    </text>

    <!-- Clean divider line uniting the header card -->
    <line x1="45" y1="72" x2="1235" y2="72" stroke="#21262d" stroke-width="1" />
  </g>

  <!-- ================= SIDE EMBEDDED LOGIC ANALYZER SIGNALS & MOTION ================= -->
  
  <!-- LEFT SIDE: PROTOCOL 01 // UART / RS485 ASYNC SERIAL STREAM -->
  <g transform="translate(0, 0)">
    <text x="45" y="130" fill="#8b949e" class="mono" font-size="9" font-weight="600" letter-spacing="1.2">PROTOCOL 01 // SERIAL ASYNC</text>
    <text x="45" y="148" fill="#56d364" class="mono" font-size="11" font-weight="700">CH0: UART_TX ──►</text>
    <text x="180" y="148" fill="#8b949e" class="mono" font-size="9.5">115200 BAUD [8N1 DATA]</text>
    
    <!-- UART Square Waveform -->
    <path id="uartLogicWave" d="M 45 182 L 95 182 L 95 158 L 145 158 L 145 182 L 195 182 L 195 158 L 235 158 L 235 182 L 295 182 L 295 158 L 345 158 L 345 182 L 375 182" 
          fill="none" stroke="#234235" stroke-width="1.8" />
    
    <!-- Gliding Data Packet moving across UART logic trace -->
    <circle r="3.2" fill="#56d364" filter="url(#packetGlow)">
      <animateMotion path="M 45 182 L 95 182 L 95 158 L 145 158 L 145 182 L 195 182 L 195 158 L 235 158 L 235 182 L 295 182 L 295 158 L 345 158 L 345 182 L 375 182" 
                     dur="3.2s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- RIGHT SIDE: PROTOCOL 02 // SPI SYNCHRONOUS HIGH-SPEED BUS -->
  <g transform="translate(0, 0)">
    <text x="905" y="130" fill="#8b949e" class="mono" font-size="9" font-weight="600" letter-spacing="1.2">PROTOCOL 02 // SYNCHRONOUS BUS</text>
    <text x="905" y="148" fill="#58d7ff" class="mono" font-size="11" font-weight="700">CH1: SPI_MOSI ──►</text>
    <text x="1040" y="148" fill="#8b949e" class="mono" font-size="9.5">10 MHz SCK [FULL-DUPLEX]</text>
    
    <!-- SPI High-Frequency Clock & Data Square Waveform -->
    <path id="spiLogicWave" d="M 905 182 L 935 182 L 935 158 L 965 158 L 965 182 L 995 182 L 995 158 L 1025 158 L 1025 182 L 1055 182 L 1055 158 L 1085 158 L 1085 182 L 1115 182 L 1115 158 L 1145 158 L 1145 182 L 1175 182 L 1175 158 L 1205 158 L 1205 182 L 1235 182" 
          fill="none" stroke="#1c3644" stroke-width="1.8" />

    <!-- Gliding Data Packet moving across SPI clock trace -->
    <circle r="3.2" fill="#58d7ff" filter="url(#packetGlow)">
      <animateMotion path="M 905 182 L 935 182 L 935 158 L 965 158 L 965 182 L 995 182 L 995 158 L 1025 158 L 1025 182 L 1055 182 L 1055 158 L 1085 158 L 1085 182 L 1115 182 L 1115 158 L 1145 158 L 1145 182 L 1175 182 L 1175 158 L 1205 158 L 1205 182 L 1235 182" 
                     dur="2.4s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- ================= MAIN IDENTITY BANNER ================= -->
  <g class="name-group">
    <text x="640" y="160" fill="#8b949e" class="mono" font-size="13.5" font-weight="600" letter-spacing="3" text-anchor="middle">// EMBEDDED FIRMWARE ENGINEER</text>
    
    <!-- Title Text with Specular Flare Sweep -->
    <g class="crisp-name">
      <text x="640" y="235" fill="url(#titleGrad)" class="sans" font-size="62" font-weight="900" letter-spacing="3" text-anchor="middle">ABHISHEK C M</text>
      <g mask="url(#nameMask)">
        <rect x="0" y="170" width="160" height="90" fill="url(#flareGrad)" transform="skewX(-25)">
          <animate attributeName="x" values="220; 1060; 220" dur="4.5s" repeatCount="indefinite" />
        </rect>
      </g>
    </g>

    <!-- Professional Role and Current Company -->
    <text x="640" y="285" fill="#e6edf3" class="sans" font-size="19" font-weight="600" letter-spacing="0.5" text-anchor="middle">
      Embedded Firmware Engineer <tspan fill="#56d364">@</tspan> Xnomous Systems Pvt Ltd
    </text>

    <!-- Philosophy Tagline -->
    <text x="640" y="318" fill="#8b949e" class="sans" font-size="14.5" font-weight="400" text-anchor="middle">
      Building dependable, low-power firmware for industrial IoT and connected ARM Cortex-M &amp; ESP32 devices.
    </text>
  </g>

  <!-- ================= BOTTOM COMPETENCY BADGES ================= -->
  <g transform="translate(640, 395)" text-anchor="middle">
    <g transform="translate(-450, 0)">
      <rect x="-80" y="-18" width="160" height="36" rx="8" fill="url(#badgeGrad)" stroke="#30363d" stroke-width="1.2" />
      <text x="0" y="5" fill="#c9d1d9" class="mono" font-size="12" font-weight="500">STM32 (Cortex-M)</text>
    </g>
    <g transform="translate(-270, 0)">
      <rect x="-80" y="-18" width="160" height="36" rx="8" fill="url(#badgeGrad)" stroke="#30363d" stroke-width="1.2" />
      <text x="0" y="5" fill="#c9d1d9" class="mono" font-size="12" font-weight="500">ESP32 Dual-Core</text>
    </g>
    <g transform="translate(-90, 0)">
      <rect x="-80" y="-18" width="160" height="36" rx="8" fill="url(#badgeGrad)" stroke="#30363d" stroke-width="1.2" />
      <text x="0" y="5" fill="#56d364" class="mono" font-size="12" font-weight="600">FreeRTOS Kernel</text>
    </g>
    <g transform="translate(90, 0)">
      <rect x="-80" y="-18" width="160" height="36" rx="8" fill="url(#badgeGrad)" stroke="#30363d" stroke-width="1.2" />
      <text x="0" y="5" fill="#c9d1d9" class="mono" font-size="12" font-weight="500">Bare-Metal &amp; HAL</text>
    </g>
    <g transform="translate(270, 0)">
      <rect x="-80" y="-18" width="160" height="36" rx="8" fill="url(#badgeGrad)" stroke="#30363d" stroke-width="1.2" />
      <text x="0" y="5" fill="#c9d1d9" class="mono" font-size="12" font-weight="500">UART • SPI • I2C</text>
    </g>
    <g transform="translate(450, 0)">
      <rect x="-80" y="-18" width="160" height="36" rx="8" fill="url(#badgeGrad)" stroke="#30363d" stroke-width="1.2" />
      <text x="0" y="5" fill="#58d7ff" class="mono" font-size="12" font-weight="500">RS485 &amp; ESP-NOW</text>
    </g>
  </g>

  <!-- ================= BOTTOM: PROTOCOL 03 // I2C TWO-WIRE BUS & MULTI-BUS LOGIC STREAM ================= -->
  <g transform="translate(0, 0)">
    <text x="45" y="452" fill="#e3b341" class="mono" font-size="10.5" font-weight="700">PROTOCOL 03 // I2C TWO-WIRE BUS [CH2: SDA // 400 kHz FAST-MODE]</text>
    <text x="640" y="452" fill="#8b949e" class="mono" font-size="10" text-anchor="middle">TRI-BUS LOGIC ANALYZER STREAM: UART (115.2k) • SPI (10M) • I2C (400k) • 100 MSPS</text>
    <text x="1235" y="452" fill="#58d7ff" class="mono" font-size="10.5" font-weight="700" text-anchor="end">CH3: SCL CLK &amp; ACK [0x48]</text>

    <!-- Multi-Protocol Logic Waveform (I2C Start Condition + Address + Data Burst) -->
    <path d="M 40 472 L 70 472 L 70 458 L 100 458 L 100 472 L 140 472 L 140 458 L 190 458 L 190 472 L 230 472 L 230 458 L 270 458 L 270 472 L 320 472 L 320 458 L 360 458 L 360 472 L 410 472 L 410 458 L 450 458 L 450 472 L 500 472 L 500 458 L 540 458 L 540 472 L 590 472 L 590 458 L 630 458 L 630 472 L 680 472 L 680 458 L 720 458 L 720 472 L 770 472 L 770 458 L 810 458 L 810 472 L 860 472 L 860 458 L 900 458 L 900 472 L 950 472 L 950 458 L 990 458 L 990 472 L 1040 472 L 1040 458 L 1080 458 L 1080 472 L 1130 472 L 1130 458 L 1170 458 L 1170 472 L 1240 472" 
          fill="none" stroke="#56d364" stroke-width="1.5" opacity="0.45" class="animated-wave" />
  </g>
</svg>
