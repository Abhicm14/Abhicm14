<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 46" width="220" height="46">
  <defs>
    <linearGradient id="badgeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141a22" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#30363d" />
      <stop offset="50%" stop-color="#58d7ff" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#30363d" />
    </linearGradient>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <!-- Button Base Frame -->
  <rect x="1" y="1" width="218" height="44" rx="8" fill="url(#badgeBg)" stroke="url(#borderGrad)" stroke-width="1.2" />

  <!-- Corner Cyber Ticks -->
  <path d="M 208 5 L 214 5 L 214 11" fill="none" stroke="#58d7ff" stroke-width="1.2" />

  <!-- Left Icon Container -->
  <rect x="8" y="7" width="32" height="32" rx="6" fill="#111c26" stroke="#253545" stroke-width="1" />
  
  <!-- LinkedIn Vector Icon (in) -->
  <g transform="translate(15, 14)" fill="#58d7ff">
    <rect x="0" y="5.5" width="3.8" height="11.5" rx="0.8" />
    <circle cx="1.9" cy="1.9" r="2" />
    <path d="M 6.5 5.5 L 10 5.5 L 10 7.2 C 10.6 6.1 11.9 5.2 13.8 5.2 C 16.8 5.2 18 7.1 18 10.2 L 18 17 L 14.2 17 L 14.2 11 C 14.2 9.4 13.6 8.3 12.1 8.3 C 10.8 8.3 10.2 9.2 10.2 10.8 L 10.2 17 L 6.5 17 Z" />
  </g>

  <!-- Right Typography -->
  <text x="48" y="20" fill="#8b949e" class="mono" font-size="8.5" font-weight="600" letter-spacing="0.8">NETWORK // PROFESSIONAL</text>
  <text x="48" y="35" fill="#e6edf3" class="sans" font-size="13" font-weight="700">LinkedIn <tspan fill="#58d7ff">↗</tspan></text>
</svg>

