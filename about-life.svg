<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 600" width="1280" height="600">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#11161d" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>

    <linearGradient id="leftBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#30363d" />
      <stop offset="40%" stop-color="#56d364" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#30363d" />
    </linearGradient>

    <linearGradient id="rightBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#30363d" />
      <stop offset="40%" stop-color="#58d7ff" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#30363d" />
    </linearGradient>

    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
      .title { font-weight: 700; font-size: 17px; letter-spacing: 1px; }
      .item-num { font-weight: 700; font-size: 12.5px; }
      .item-title { font-weight: 600; font-size: 14.5px; fill: #e6edf3; }
      .item-desc { font-weight: 400; font-size: 13px; fill: #8b949e; }
      .highlight-text { fill: #b9d0c5; }
    </style>
  </defs>

  <!-- ================= LEFT CARD: WHAT I BUILD ================= -->
  <g transform="translate(30, 10)">
    <!-- Card Frame -->
    <rect x="0" y="0" width="595" height="580" rx="14" fill="url(#cardBg)" stroke="url(#leftBorder)" stroke-width="1.5" />
    
    <!-- Top Header Bar -->
    <g transform="translate(35, 45)">
      <rect x="0" y="-18" width="38" height="38" rx="8" fill="#16231c" stroke="#315b4a" stroke-width="1.2" />
      <text x="19" y="6" font-size="18" text-anchor="middle">⚡</text>
      <text x="50" y="2" fill="#56d364" class="mono title">WHAT I BUILD &amp; ARCHITECT</text>
      <text x="50" y="21" fill="#8b949e" class="sans" font-size="12" font-weight="500">Low-Level Firmware &amp; Edge Hardware Systems</text>
    </g>

    <line x1="35" y1="84" x2="560" y2="84" stroke="#21262d" stroke-width="1" />

    <!-- Feature Items List -->
    <g transform="translate(35, 120)">
      <!-- Item 1 -->
      <g transform="translate(0, 0)">
        <text x="0" y="0" fill="#56d364" class="mono item-num">[01]</text>
        <text x="45" y="0" class="sans item-title">Bare-Metal &amp; HAL Driver Engineering</text>
        <text x="45" y="20" class="sans item-desc">Configuring GPIOs, Timers, DMA, and interrupts on ARM Cortex-M</text>
        <text x="45" y="38" class="sans item-desc">(STM32) and ESP32 with zero-overhead register efficiency.</text>
      </g>

      <!-- Item 2 -->
      <g transform="translate(0, 100)">
        <text x="0" y="0" fill="#56d364" class="mono item-num">[02]</text>
        <text x="45" y="0" class="sans item-title">Real-Time Multitasking (FreeRTOS)</text>
        <text x="45" y="20" class="sans item-desc">Thread-safe inter-task communication via Queues, Semaphores,</text>
        <text x="45" y="38" class="sans item-desc">Mutexes, Event Groups, and dual-core task affinity pinning.</text>
      </g>

      <!-- Item 3 -->
      <g transform="translate(0, 200)">
        <text x="0" y="0" fill="#56d364" class="mono item-num">[03]</text>
        <text x="45" y="0" class="sans item-title">Industrial Communication Pipelines</text>
        <text x="45" y="20" class="sans item-desc">Building robust fieldbus architectures: noise-tolerant RS485 / MAX485,</text>
        <text x="45" y="38" class="sans item-desc">UART DMA circular buffers, I2C peripheral drivers, and SPI buses.</text>
      </g>

      <!-- Item 4 -->
      <g transform="translate(0, 300)">
        <text x="0" y="0" fill="#56d364" class="mono item-num">[04]</text>
        <text x="45" y="0" class="sans item-title">Low-Power Edge IoT Telemetry</text>
        <text x="45" y="20" class="sans item-desc">Designing multi-node mesh networks with ESP-NOW and MQTT,</text>
        <text x="45" y="38" class="sans item-desc">leveraging deep-sleep standby modes with external GPIO wake-ups.</text>
      </g>
    </g>
  </g>

  <!-- ================= RIGHT CARD: LIFE BEYOND CODE ================= -->
  <g transform="translate(655, 10)">
    <!-- Card Frame -->
    <rect x="0" y="0" width="595" height="580" rx="14" fill="url(#cardBg)" stroke="url(#rightBorder)" stroke-width="1.5" />
    
    <!-- Top Header Bar -->
    <g transform="translate(35, 45)">
      <rect x="0" y="-18" width="38" height="38" rx="8" fill="#13212b" stroke="#254659" stroke-width="1.2" />
      <text x="19" y="6" font-size="18" text-anchor="middle">🔬</text>
      <text x="50" y="2" fill="#58d7ff" class="mono title">BEYOND THE LOGIC ANALYZER</text>
      <text x="50" y="21" fill="#8b949e" class="sans" font-size="12" font-weight="500">Hardware Prototyping, Research &amp; Community</text>
    </g>

    <line x1="35" y1="84" x2="560" y2="84" stroke="#21262d" stroke-width="1" />

    <!-- Feature Items List -->
    <g transform="translate(35, 120)">
      <!-- Item 1 -->
      <g transform="translate(0, 0)">
        <text x="0" y="0" fill="#58d7ff" class="mono item-num">[01]</text>
        <text x="45" y="0" class="sans item-title">Bench Bring-Up &amp; Circuit Debugging</text>
        <text x="45" y="20" class="sans item-desc">Hands-on with digital oscilloscopes, logic analyzers, and breadboards</text>
        <text x="45" y="38" class="sans item-desc">decoding noisy I2C and UART waveforms on physical hardware.</text>
      </g>

      <!-- Item 2 -->
      <g transform="translate(0, 100)">
        <text x="0" y="0" fill="#58d7ff" class="mono item-num">[02]</text>
        <text x="45" y="0" class="sans item-title">Springer Nature Research &amp; Publications</text>
        <text x="45" y="20" class="sans item-desc">Co-authored &amp; published research on Automatic Speech Recognition</text>
        <text x="45" y="38" class="sans item-desc">(ASR) elevator accessibility systems in Springer Nature (ICMISC 2024).</text>
      </g>

      <!-- Item 3 -->
      <g transform="translate(0, 200)">
        <text x="0" y="0" fill="#58d7ff" class="mono item-num">[03]</text>
        <text x="45" y="0" class="sans item-title">Hardware Architecture Exploration</text>
        <text x="45" y="20" class="sans item-desc">Constantly studying microcontroller datasheets, memory layouts, linker</text>
        <text x="45" y="38" class="sans item-desc">scripts, register errata, and physical board schematic layouts.</text>
      </g>

      <!-- Item 4: Systems Programming & Tooling Automation -->
      <g transform="translate(0, 300)">
        <text x="0" y="0" fill="#56d364" class="mono item-num">[04]</text>
        <text x="45" y="0" class="sans item-title">Systems Programming &amp; Tooling Automation</text>
        <text x="45" y="20" class="sans item-desc">Building hands-on codebases across C, modern C++, Python, and Linux Bash to</text>
        <text x="45" y="38" class="sans item-desc">master memory models, data structures, and automated firmware test pipelines.</text>
      </g>
    </g>
  </g>
</svg>
