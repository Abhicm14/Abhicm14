<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 490" width="1280" height="490">
  <defs>
    <linearGradient id="stackBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1219" />
      <stop offset="50%" stop-color="#0d171e" />
      <stop offset="100%" stop-color="#091017" />
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#30363d" />
      <stop offset="50%" stop-color="#56d364" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#30363d" />
    </linearGradient>

    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>

    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
      .cat-title { font-weight: 700; font-size: 13px; letter-spacing: 1.2px; }
      .pill-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-weight: 500; font-size: 13px; fill: #e6edf3; }
    </style>
  </defs>

  <!-- Frame Base -->
  <rect x="2" y="2" width="1276" height="486" rx="16" fill="url(#stackBg)" stroke="url(#borderGrad)" stroke-width="1.5" />

  <!-- Section Header -->
  <g transform="translate(640, 45)" text-anchor="middle">
    <text y="0" fill="#8b949e" class="mono" font-size="12.5" font-weight="600" letter-spacing="3">// HARDWARE &amp; FIRMWARE ARSENAL</text>
    <text y="28" fill="#e6edf3" class="sans" font-size="24" font-weight="800" letter-spacing="0.5">TECHNICAL STACK &amp; SILICON ECOSYSTEM</text>
  </g>

  <!-- Category 1: LANGUAGES & CORE FOUNDATIONS -->
  <g transform="translate(50, 118)">
    <text x="0" y="0" fill="#56d364" class="mono cat-title">💻 LANGUAGES &amp; CORE FOUNDATIONS</text>
    <g transform="translate(0, 14)">
      <!-- Pill 1: Embedded C -->
      <g transform="translate(0, 0)">
        <rect width="180" height="38" rx="8" fill="url(#pillGrad)" stroke="#30363d" stroke-width="1.2" />
        <text x="90" y="24" class="pill-text" text-anchor="middle">Embedded C (C99/C11)</text>
      </g>
      <!-- Pill 2: C Language -->
      <g transform="translate(195, 0)">
        <rect width="120" height="38" rx="8" fill="url(#pillGrad)" stroke="#30363d" stroke-width="1.2" />
        <text x="60" y="24" class="pill-text" text-anchor="middle">C Language</text>
      </g>
      <!-- Pill 3: Modern C++ -->
      <g transform="translate(330, 0)">
        <rect width="125" height="38" rx="8" fill="url(#pillGrad)" stroke="#30363d" stroke-width="1.2" />
        <text x="62.5" y="24" class="pill-text" text-anchor="middle">Modern C++</text>
      </g>
      <!-- Pill 4: Python -->
      <g transform="translate(470, 0)">
        <rect width="180" height="38" rx="8" fill="url(#pillGrad)" stroke="#30363d" stroke-width="1.2" />
        <text x="90" y="24" class="pill-text" text-anchor="middle">Python 3 (Automation)</text>
      </g>
      <!-- Pill 5: Bash -->
      <g transform="translate(665, 0)">
        <rect width="175" height="38" rx="8" fill="url(#pillGrad)" stroke="#30363d" stroke-width="1.2" />
        <text x="87.5" y="24" class="pill-text" text-anchor="middle">Bash Shell Scripting</text>
      </g>
    </g>
  </g>

  <!-- Category 2: MICROCONTROLLERS & HARDWARE -->
  <g transform="translate(50, 208)">
    <text x="0" y="0" fill="#58d7ff" class="mono cat-title">🎛️ MICROCONTROLLERS &amp; EMBEDDED HARDWARE</text>
    <g transform="translate(0, 14)">
      <!-- Pill 1: STM32 -->
      <g transform="translate(0, 0)">
        <rect width="220" height="38" rx="8" fill="url(#pillGrad)" stroke="#30363d" stroke-width="1.2" />
        <text x="110" y="24" class="pill-text" text-anchor="middle">STM32 (ARM Cortex-M4/M3)</text>
      </g>
      <!-- Pill 2: ESP32 -->
      <g transform="translate(235, 0)">
        <rect width="190" height="38" rx="8" fill="url(#pillGrad)" stroke="#30363d" stroke-width="1.2" />
        <text x="95" y="24" class="pill-text" text-anchor="middle">ESP32 (Xtensa Dual-Core)</text>
      </g>
      <!-- Pill 3: ESP8266 -->
      <g transform="translate(440, 0)">
        <rect width="145" height="38" rx="8" fill="url(#pillGrad)" stroke="#30363d" stroke-width="1.2" />
        <text x="72.5" y="24" class="pill-text" text-anchor="middle">ESP8266 Wi-Fi</text>
      </g>
      <!-- Pill 4: Raspberry Pi 4 -->
      <g transform="translate(600, 0)">
        <rect width="195" height="38" rx="8" fill="url(#pillGrad)" stroke="#30363d" stroke-width="1.2" />
        <text x="97.5" y="24" class="pill-text" text-anchor="middle">Raspberry Pi 4 (Edge Gateway)</text>
      </g>
      <!-- Pill 5: Arduino -->
      <g transform="translate(810, 0)">
        <rect width="140" height="38" rx="8" fill="url(#pillGrad)" stroke="#30363d" stroke-width="1.2" />
        <text x="70" y="24" class="pill-text" text-anchor="middle">Arduino Nano</text>
      </g>
    </g>
  </g>

  <!-- Category 3: COMMUNICATION BUSES & PROTOCOLS -->
  <g transform="translate(50, 298)">
    <text x="0" y="0" fill="#56d364" class="mono cat-title">📡 COMMUNICATION BUSES &amp; INDUSTRIAL NETWORKS</text>
    <g transform="translate(0, 14)">
      <!-- Pill 1: UART -->
      <g transform="translate(0, 0)">
        <rect width="140" height="38" rx="8" fill="url(#pillGrad)" stroke="#30363d" stroke-width="1.2" />
        <text x="70" y="24" class="pill-text" text-anchor="middle">UART / USART</text>
      </g>
      <!-- Pill 2: I2C -->
      <g transform="translate(155, 0)">
        <rect width="115" height="38" rx="8" fill="url(#pillGrad)" stroke="#30363d" stroke-width="1.2" />
        <text x="57.5" y="24" class="pill-text" text-anchor="middle">I²C Bus (SSD1306)</text>
      </g>
      <!-- Pill 3: SPI -->
      <g transform="translate(285, 0)">
        <rect width="115" height="38" rx="8" fill="url(#pillGrad)" stroke="#30363d" stroke-width="1.2" />
        <text x="57.5" y="24" class="pill-text" text-anchor="middle">SPI Bus</text>
      </g>
      <!-- Pill 4: RS485 -->
      <g transform="translate(415, 0)">
        <rect width="180" height="38" rx="8" fill="url(#pillGrad)" stroke="#30363d" stroke-width="1.2" />
        <text x="90" y="24" class="pill-text" text-anchor="middle">RS485 / MAX485 Fieldbus</text>
      </g>
      <!-- Pill 5: ESP-NOW -->
      <g transform="translate(610, 0)">
        <rect width="165" height="38" rx="8" fill="url(#pillGrad)" stroke="#30363d" stroke-width="1.2" />
        <text x="82.5" y="24" class="pill-text" text-anchor="middle">ESP-NOW Wireless</text>
      </g>
      <!-- Pill 6: MQTT -->
      <g transform="translate(790, 0)">
        <rect width="130" height="38" rx="8" fill="url(#pillGrad)" stroke="#30363d" stroke-width="1.2" />
        <text x="65" y="24" class="pill-text" text-anchor="middle">MQTT (IoT Broker)</text>
      </g>
    </g>
  </g>

  <!-- Category 4: RTOS & DEVELOPMENT TOOLCHAINS -->
  <g transform="translate(50, 388)">
    <text x="0" y="0" fill="#58d7ff" class="mono cat-title">⚙️ RTOS, DEVELOPMENT ENVIRONMENTS &amp; TOOLING</text>
    <g transform="translate(0, 14)">
      <!-- Pill 1: FreeRTOS -->
      <g transform="translate(0, 0)">
        <rect width="160" height="38" rx="8" fill="url(#pillGrad)" stroke="#30363d" stroke-width="1.2" />
        <text x="80" y="24" class="pill-text" text-anchor="middle">FreeRTOS Kernel</text>
      </g>
      <!-- Pill 2: STM32CubeIDE -->
      <g transform="translate(175, 0)">
        <rect width="155" height="38" rx="8" fill="url(#pillGrad)" stroke="#30363d" stroke-width="1.2" />
        <text x="77.5" y="24" class="pill-text" text-anchor="middle">STM32CubeIDE</text>
      </g>
      <!-- Pill 3: ESP-IDF -->
      <g transform="translate(345, 0)">
        <rect width="120" height="38" rx="8" fill="url(#pillGrad)" stroke="#30363d" stroke-width="1.2" />
        <text x="60" y="24" class="pill-text" text-anchor="middle">ESP-IDF Core</text>
      </g>
      <!-- Pill 4: Linux -->
      <g transform="translate(480, 0)">
        <rect width="170" height="38" rx="8" fill="url(#pillGrad)" stroke="#30363d" stroke-width="1.2" />
        <text x="85" y="24" class="pill-text" text-anchor="middle">Linux Environment</text>
      </g>
      <!-- Pill 5: VS Code -->
      <g transform="translate(665, 0)">
        <rect width="120" height="38" rx="8" fill="url(#pillGrad)" stroke="#30363d" stroke-width="1.2" />
        <text x="60" y="24" class="pill-text" text-anchor="middle">VS Code</text>
      </g>
      <!-- Pill 6: Git -->
      <g transform="translate(800, 0)">
        <rect width="140" height="38" rx="8" fill="url(#pillGrad)" stroke="#30363d" stroke-width="1.2" />
        <text x="70" y="24" class="pill-text" text-anchor="middle">Git / GitHub</text>
      </g>
    </g>
  </g>
</svg>
