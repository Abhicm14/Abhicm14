<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 120" width="1280" height="120">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="headerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1219" />
      <stop offset="50%" stop-color="#0d171e" />
      <stop offset="100%" stop-color="#091017" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="headerBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#30363d" />
      <stop offset="50%" stop-color="#56d364" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#30363d" />
    </linearGradient>

    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <!-- Frame Base -->
  <rect x="2" y="2" width="1276" height="116" rx="14" fill="url(#headerBg)" stroke="url(#headerBorder)" stroke-width="1.5" />

  <!-- Left Content -->
  <g transform="translate(45, 38)">
    <text x="0" y="0" fill="#56d364" class="mono" font-size="12" font-weight="600" letter-spacing="2">// COMMIT TELEMETRY &amp; CHRONOLOGICAL ACTIVITY</text>
    <text x="0" y="32" fill="#e6edf3" class="sans" font-size="26" font-weight="800" letter-spacing="0.5">🌃 MY CONTRIBUTION CITY</text>
    <text x="0" y="56" fill="#8b949e" class="sans" font-size="13.5">
      Every commit builds another tower — rebuilt automatically every day.
    </text>
  </g>

  <!-- Right Pill Badge -->
  <g transform="translate(1235, 60)" text-anchor="end">
    <rect x="-240" y="-18" width="240" height="36" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.2" />
    <circle cx="-220" cy="0" r="4.5" fill="#56d364" />
    <text x="-205" y="5" fill="#c9d1d9" class="mono" font-size="11.5" font-weight="600" text-anchor="start">LIVE COMMITS • 3D VIEW</text>
  </g>
</svg>

