<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 46" width="220" height="46">
  <defs>
    <linearGradient id="badgeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141a22" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#30363d" />
      <stop offset="50%" stop-color="#58d7ff" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#30363d" />
    </linearGradient>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <!-- Button Base Frame -->
  <rect x="1" y="1" width="218" height="44" rx="8" fill="url(#badgeBg)" stroke="url(#borderGrad)" stroke-width="1.2" />

  <!-- Corner Cyber Ticks -->
  <path d="M 208 5 L 214 5 L 214 11" fill="none" stroke="#58d7ff" stroke-width="1.2" />

  <!-- Left Icon Container -->
  <rect x="8" y="7" width="32" height="32" rx="6" fill="#111c26" stroke="#253545" stroke-width="1" />
  
  <!-- Springer Nature Citation / Paper Icon -->
  <g transform="translate(15, 14)" stroke="#58d7ff" stroke-width="1.4" fill="none">
    <path d="M 2 2 L 11 2 L 16 7 L 16 16 L 2 16 Z" />
    <polyline points="11,2 11,7 16,7" />
    <line x1="5" y1="10" x2="13" y2="10" />
    <line x1="5" y1="13" x2="11" y2="13" />
  </g>

  <!-- Right Typography -->
  <text x="48" y="20" fill="#8b949e" class="mono" font-size="8.5" font-weight="600" letter-spacing="0.8">RESEARCH // DOI CITATION</text>
  <text x="48" y="35" fill="#e6edf3" class="sans" font-size="13" font-weight="700">Springer Nature <tspan fill="#58d7ff">↗</tspan></text>
</svg>

